services:
  twinkle-image:
    image: twinkle-image:3.1.9
    container_name: twinkle-image
    ports:
      - "${TWINKLE_PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NOVA_TASK_DB: /app/backend/data/nova-tasks.sqlite
      NOVA_IMAGE_DIR: /app/backend/data/nova-images
    volumes:
      - ./data:/app/backend/data
      - ./blacklist.json:/app/backend/blacklist.json
      - ./prompts.json:/app/backend/prompts.json
      - ./.env:/app/.env
    restart: unless-stopped
